<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusConnect | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

<div class="login-box">

<h1>CampusConnect</h1>

<h2>Welcome Back 👋</h2>

<p class="subtitle">
Sign in to continue your learning journey.
</p>

<form id="loginForm">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

</div>
<p id="errorMessage"></p>
<button type="submit">

Login

</button>
<p class="forgot-password">
    <a href="#">Forgot Password?</a>
</p>
</form>

<p class="signup-text">

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</p>

</div>

</div>

<script src="js/script.js"></script>

</body>

</html>
