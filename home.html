<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Home</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="home-container">

    <!-- Header -->
    <header class="top-bar">

        <div class="logo">
            <h1>CampusConnect</h1>

            <p>Hello, Pranali 👋</p>

            <span>Let's explore your campus today</span>
        </div>

        <div class="top-icons">

            <i class="fa-solid fa-bell"></i>

            <i class="fa-solid fa-user"></i>

        </div>

    </header>


    <!-- Feature Cards -->

    <section class="cards">

        <div class="card" id="notesCard">

            <i class="fa-solid fa-book"></i>

            <h3>Notes</h3>

        </div>

        <div class="card" id="eventsCard">

            <i class="fa-solid fa-calendar-days"></i>

            <h3>Events</h3>

        </div>

        <div class="card" id="placementCard">

            <i class="fa-solid fa-briefcase"></i>

            <h3>Placement</h3>

        </div>

        <div class="card" id="profileCard">

            <i class="fa-solid fa-user"></i>

            <h3>Profile</h3>

        </div>

    </section>


    <!-- Search -->

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input type="text" placeholder="Search notes...">

    </div>


    <!-- Upcoming Event -->

    <section class="event-section">

        <h2 class="section-title">Upcoming Events</h2>

        <div class="event-card">

            <div class="event-icon">

                <i class="fa-solid fa-calendar"></i>

            </div>

            <div>

                <h3>Hackathon 2026</h3>

                <p>10 July | Seminar Hall</p>

            </div>

        </div>

    </section>


    <!-- Recent Notes -->

    <section class="notes-section">

        <h2 class="section-title">Recent Notes</h2>

        <div class="note-card">

            <div class="note-icon">

                <i class="fa-solid fa-book-open"></i>

            </div>

            <div>

                <h3>DBMS Unit 3</h3>

                <p>Last updated : Today</p>

            </div>

        </div>

    </section>


    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="home.html" class="active">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>

        <a href="notes.html">

            <i class="fa-solid fa-book"></i>

            <span>Notes</span>

        </a>

        <a href="events.html">

            <i class="fa-solid fa-calendar-days"></i>

            <span>Events</span>

        </a>

        <a href="profile.html">

            <i class="fa-solid fa-user"></i>

            <span>Profile</span>

        </a>

    </nav>

</div>

<script src="js/script.js"></script>

</body>
</html>
