<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Events</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="home-container">

    <!-- Header -->

    <header class="top-bar">

        <div class="logo">

            <h1>Events</h1>

            <p>Campus Activities 🎉</p>

            <span>Stay updated with upcoming events</span>

        </div>

        <div class="top-icons">

            <i class="fa-solid fa-bell"></i>

            <i class="fa-solid fa-calendar-days"></i>

        </div>

    </header>

    <!-- Search -->

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
    type="text"
    id="eventSearch"
    placeholder="Search Events...">
    </div>

    <!-- Upcoming Events -->

    <h2 class="section-title">

        Upcoming Events

    </h2>

    <!-- Event 1 -->

    <!-- Event 1 -->

<a href="event-details.html" class="event-link">

    <div class="event-card" id="hackathonCard">

        <div class="event-icon">

            <i class="fa-solid fa-code"></i>

        </div>

        <div>

            <h3>Hackathon 2026</h3>

            <p>10 July • Seminar Hall</p>

        </div>

    </div>

</a>

    <!-- Event 2 -->

    <div class="event-card" id="aiCard">

        <div class="event-icon">

            <i class="fa-solid fa-laptop-code"></i>

        </div>

        <div>

            <h3>AI Workshop</h3>

            <p>15 July • Computer Lab</p>

        </div>

    </div>

    <!-- Event 3 -->

    <div class="event-card" id="seminarCard">

        <div class="event-icon">

            <i class="fa-solid fa-microphone"></i>

        </div>

        <div>

            <h3>Technical Seminar</h3>

            <p>20 July • Auditorium</p>

        </div>

    </div>

    <!-- Event 4 -->

    <div class="event-card" id="recruitmentCard">

        <div class="event-icon">

            <i class="fa-solid fa-users"></i>

        </div>

        <div>

            <h3>Campus Recruitment Drive</h3>

            <p>25 July • Placement Cell</p>

        </div>

    </div>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="home.html">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>

        <a href="notes.html">

            <i class="fa-solid fa-book"></i>

            <span>Notes</span>

        </a>

        <a href="events.html" class="active">

            <i class="fa-solid fa-calendar-days"></i>

            <span>Events</span>

        </a>

        <a href="profile.html">

            <i class="fa-solid fa-user"></i>

            <span>Profile</span>

        </a>

    </nav>

</div>

<script src="js/script.js"></script>

</body>

</html>
