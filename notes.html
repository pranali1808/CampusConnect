<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Notes</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="home-container">

    <!-- Header -->

    <header class="top-bar">

        <div class="logo">

            <h1>Notes</h1>

            <p>Study Materials 📚</p>

            <span>Find your notes quickly</span>

        </div>

        <div class="top-icons">

            <i class="fa-solid fa-magnifying-glass"></i>

            <i class="fa-solid fa-filter"></i>

        </div>

    </header>

    <!-- Search -->

    <div class="search-box">

        <i class="fa-solid fa-search"></i>

        <input 
        type="text"
        id="searchInput"
        placeholder="Search Notes...">

    </div>

    <!-- Categories -->

    <section class="cards">

    <div class="card" id="dbmsCard">
        <a href="pdf/DBMS.pdf" target="_blank" class="card-link">
            <i class="fa-solid fa-database"></i>
            <h3>DBMS</h3>
        </a>
    </div>

    <div class="card" id="pythonCard">
        <a href="pdf/Python.pdf" target="_blank" class="card-link">
            <i class="fa-brands fa-python"></i>
            <h3>Python</h3>
        </a>
    </div>

    <div class="card" id="javaCard">
        <a href="pdf/Java.pdf" target="_blank" class="card-link">
            <i class="fa-brands fa-java"></i>
            <h3>Java</h3>
        </a>
    </div>

    <div class="card" id="webCard">
        <a href="pdf/WebDev.pdf" target="_blank" class="card-link">
            <i class="fa-solid fa-globe"></i>
            <h3>Web Dev</h3>
        </a>
    </div>

</section>

    <!-- Recent Notes -->

    <h2 class="section-title">

        Recent Notes

    </h2>

    <div class="note-card">

        <div class="note-icon">

            <i class="fa-solid fa-file-lines"></i>

        </div>

        <div>

            <h3>DBMS Unit 1</h3>

            <p>Updated Today</p>

        </div>

    </div>

    <div class="note-card">

        <div class="note-icon">

            <i class="fa-solid fa-file-lines"></i>

        </div>

        <div>

            <h3>Python Functions</h3>

            <p>Updated Yesterday</p>

        </div>

    </div>

    <div class="note-card">

        <div class="note-icon">

            <i class="fa-solid fa-file-lines"></i>

        </div>

        <div>

            <h3>Java OOP</h3>

            <p>Updated 2 Days Ago</p>

        </div>

    </div>

    <div class="note-card">

        <div class="note-icon">

            <i class="fa-solid fa-file-lines"></i>

        </div>

        <div>

            <h3>HTML & CSS</h3>

            <p>Updated Last Week</p>

        </div>

    </div>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="home.html">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>

        <a href="notes.html" class="active">

            <i class="fa-solid fa-book"></i>

            <span>Notes</span>

        </a>

        <a href="events.html">

            <i class="fa-solid fa-calendar-days"></i>

            <span>Events</span>

        </a>

        <a href="profile.html">

            <i class="fa-solid fa-user"></i>

            <span>Profile</span>

        </a>

    </nav>

</div>

<script src="js/script.js"></script>

</body>

</html>
